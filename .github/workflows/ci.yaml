name: CI

on:
  push:
    branches:
      - stage
      - master

  pull_request:
    branches:
      - stage
      - master

  workflow_dispatch: # button on GitHub Actions to trigger the workflow manually

permissions:
  contents: read

jobs:
  validate-python:
    name: Validate Python
    runs-on: ubuntu-latest # temporary linux machine to run the job

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python compilation
        run: python -m compileall app config

      - name: Run tests
        env:
          OPEN_METEO_URL: https://geocoding-api.open-meteo.com
          OPEN_METEO_FORECAST_URL: https://api.open-meteo.com
          OPEN_METEO_ARCHIVE_URL: https://archive-api.open-meteo.com
          DATABASE_URL: mysql+pymysql://ci_user:ci_password@localhost:3306/weather_analysis_test
        run: python -m pytest

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: validate-python

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag weather-analysis:${{ github.sha }} .
  
  publish-production:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs:
      - validate-python
      - build-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate in GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  publish-stage:
    name: Publish stage image
    runs-on: ubuntu-latest
    needs:
      - validate-python
      - build-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate in GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish stage image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:stage
            ghcr.io/${{ github.repository }}:stage-${{ github.sha }}