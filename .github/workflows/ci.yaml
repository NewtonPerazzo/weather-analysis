name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch: # button on GitHub Actions to trigger the workflow manually

permissions:
  contents: read

jobs:
  validate-python:
    name: Validate Python
    runs-on: ubuntu-latest # temporary linux machine to run the job

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python compilation
        run: python -m compileall app config

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: validate-python

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag weather-analysis:${{ github.sha }} .